<!DOCTYPE html>
<html>
    <head>
        <title>Chat With RAG chatbot</title>
        <link rel="stylesheet" href="/static/chatting.css" />
    </head>
    <body>
        <h1>Chat With RAG chatbot</h1>
        <form action="" onsubmit="sendMessage(event)">
            <input type="text" id="messageText" autocomplete="off"/>
            <button>Send</button>
        </form>
        <ul id='messages'>
        </ul>
        <script>
            var ws = new WebSocket("ws://localhost:8001/");
            var currentMessage = null;

            ws.onmessage = function(event) {
                var messages = document.getElementById('messages');
                
                // If there's no current message, create a new one with the "Assistant:" prefix
                if (!currentMessage) {
                    currentMessage = document.createElement('li');
                    currentMessage.className = 'assistant';
                    var prefix = document.createTextNode("Assistant: ");
                    currentMessage.appendChild(prefix);
                    messages.appendChild(currentMessage);
                }

                // Append the chunk to the current message
                var content = document.createTextNode(event.data);
                currentMessage.appendChild(content);
            };

            function sendMessage(event) {
                var input = document.getElementById("messageText");
                var messages = document.getElementById('messages');
                
                // Display user message
                var userMessage = document.createElement('li');
                userMessage.className = 'user';
                var userContent = document.createTextNode("User: " + input.value);
                userMessage.appendChild(userContent);
                messages.appendChild(userMessage);

                // Send user message to the server
                ws.send(input.value);
                input.value = '';
                event.preventDefault();

                // Reset the current message
                currentMessage = null;
            }
        </script>
    </body>
</html>
